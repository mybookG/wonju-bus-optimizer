services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: wonju-postgres
    environment:
      POSTGRES_DB: wonju_bus
      POSTGRES_USER: wonju
      POSTGRES_PASSWORD: wonju1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonju -d wonju_bus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wonju-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: wonju-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USERNAME: wonju
      DB_PASSWORD: wonju1234
      REDIS_HOST: redis
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TAGO_API_KEY: ${TAGO_API_KEY}
      KOSIS_API_KEY: ${KOSIS_API_KEY}
      SENS_ACCESS_KEY: ${SENS_ACCESS_KEY:-}
      SENS_SECRET_KEY: ${SENS_SECRET_KEY:-}
      SENS_SERVICE_ID: ${SENS_SERVICE_ID:-}
      SENS_SENDER: ${SENS_SENDER:-}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
