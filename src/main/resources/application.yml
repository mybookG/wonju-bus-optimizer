spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/wonju_bus
    username: ${DB_USERNAME:wonju}
    password: ${DB_PASSWORD:wonju1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

server:
  port: 8080

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.0-flash
  base-url: https://generativelanguage.googleapis.com

public-api:
  tago:
    key: ${TAGO_API_KEY:}
    base-url: https://apis.data.go.kr/1613000
  kosis:
    key: ${KOSIS_API_KEY:}
    base-url: https://kosis.kr/openapi

sens:
  access-key: ${SENS_ACCESS_KEY:}
  secret-key: ${SENS_SECRET_KEY:}
  service-id: ${SENS_SERVICE_ID:}
  sender: ${SENS_SENDER:}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-bytes}
  expiration-ms: 86400000

logging:
  level:
    com.wonju.bus: DEBUG
    org.springframework.batch: INFO
    org.hibernate.SQL: DEBUG
